run:
  id_prefix: vae_golf_smoke
  seed: 42
  output_root: ./local_run_golf/vae_runs
  dataset_local_root: ./local_run_golf/raw_shards
  target_frames: 6000
  milestone_frames: []
  checkpoint_every_frames: 6000
  preview_every_frames: 3000
  log_every_steps: 10
  save_optimizer_state: false

data:
  source: shards
  shards_dir: ./local_run_golf/raw_shards
  shuffle_shards: true
  shuffle_frames_within_shard: true
  batch_size: 64
  drop_last: true
  num_workers: 1
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2

model:
  base_channels: 16
  latent_channels: 4

loss:
  recon_l1_weight: 1.0
  lpips_weight: 0.0
  kl_weight: 1.0
  kl_beta_start: 1.0e-6
  kl_beta_end: 5.0e-4
  kl_warmup_frames: 3000

optimizer:
  lr: 2.0e-4
  weight_decay: 1.0e-4

training:
  mixed_precision: fp32
  max_grad_norm: 1.0
  compile_model: false

preview:
  fixed_preview_images: 8
  fixed_preview_video_frames: 16

wandb:
  enabled: false
