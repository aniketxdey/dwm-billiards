run:
  preview_id: local_smoke_preview
  seed: 42
  output_root: ./local_run/inference_runs
  device: cpu
  ddim_steps: 8
  horizon: 8
  video_fps: 8
  decode_batch_size: 64
  num_clips: 2

model:
  name: dit_local_smoke
  checkpoint_path: ./local_run/wm_runs/dit_local_smoke_run01/checkpoints/ckpt_000004000.pt
  train_config_path: ./local_run/wm_smoke.yaml

data:
  shards_dir: ./local_run/latents/local_smoke/shards
  val_shards: 1
  sample_from: eval

vae:
  enabled: true
  checkpoint_path: ./local_run/vae_runs/vae_local_smoke_run01/checkpoints/ckpt_0006000.pt
  base_channels: 16
  latent_channels: 4

actions:
  source: dataset

viz:
  write_video: true
  write_action_timeline: true
  include_gt_if_available: true
